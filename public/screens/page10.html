<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SPTracker Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f9f9ff",
                        "on-primary-fixed-variant": "#004492",
                        "inverse-on-surface": "#ecf1ff",
                        "tertiary-fixed": "#ffdbcd",
                        "background": "#f9f9ff",
                        "surface-container-highest": "#d8e3fb",
                        "primary-fixed-dim": "#acc7ff",
                        "on-background": "#111c2d",
                        "on-secondary-fixed": "#001f25",
                        "on-surface": "#111c2d",
                        "tertiary-container": "#a23f01",
                        "error-container": "#ffdad6",
                        "primary-container": "#005bbf",
                        "surface-container": "#e7eeff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#001a40",
                        "surface-container-low": "#f0f3ff",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#360f00",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#ffceb9",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#00616f",
                        "surface-container-high": "#dee8ff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb595",
                        "surface-dim": "#cfdaf2",
                        "secondary-fixed-dim": "#2fd9f4",
                        "surface-tint": "#005bbf",
                        "secondary": "#006877",
                        "error": "#ba1a1a",
                        "outline": "#727784",
                        "inverse-surface": "#263143",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#424753",
                        "secondary-container": "#3fe1fd",
                        "primary": "#004492",
                        "surface-variant": "#d8e3fb",
                        "tertiary": "#7c2e00",
                        "outline-variant": "#c2c6d5",
                        "on-primary-container": "#c8d8ff",
                        "primary-fixed": "#d7e2ff",
                        "inverse-primary": "#acc7ff",
                        "surface-bright": "#f9f9ff",
                        "secondary-fixed": "#a2eeff",
                        "on-secondary-fixed-variant": "#004e5a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "64px",
                        "gutter": "24px",
                        "unit": "8px",
                        "container-padding": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.4", "letterSpacing": "0.04em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display-lg": ["56px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f0f3ff;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 91, 191, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(63, 225, 253, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 91, 191, 0.05);
        }

        .glass-panel-heavy {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 40px 0 rgba(0, 91, 191, 0.08);
        }

        .shine-effect:hover {
            position: relative;
            overflow: hidden;
        }
        
        .shine-effect:hover::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg);
            animation: shine 1s forwards;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .btn-primary {
            background-color: #004492;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(63, 225, 253, 0.3);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(63, 225, 253, 0.5);
            transform: translateY(-1px);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.6);
            border-color: #3fe1fd;
            outline: none;
            box-shadow: 0 0 0 2px rgba(63, 225, 253, 0.2);
        }
        
        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 91, 191, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 91, 191, 0.4);
        }
    </style>
</head>
<body class="text-on-surface font-body-md h-screen flex overflow-hidden selection:bg-secondary-container selection:text-on-secondary-container">
<!-- FIXED SIDEBAR -->

<!-- MAIN CONTENT AREA -->
<main class="flex-1 flex flex-col h-full overflow-hidden relative">
<!-- TOP HEADER -->
<header class="glass-panel w-full px-gutter py-4 flex justify-between items-center z-30 sticky top-0 rounded-b-[30px] mx-4 mt-4" style="width: calc(100% - 32px);">
<div class="w-full max-w-md relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="glass-input w-full pl-12 pr-4 py-2.5 rounded-full font-body-md text-on-surface placeholder:text-on-surface-variant/60" placeholder="Search portfolios, activities, or insights..." type="text"/>
</div>
<div class="flex items-center gap-4">
<button class="p-2.5 glass-input rounded-full hover:bg-white/60 transition-colors text-on-surface-variant shine-effect">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="p-2.5 glass-input rounded-full hover:bg-white/60 transition-colors text-on-surface-variant shine-effect">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- SCROLLABLE DASHBOARD VIEWPORT -->
<div class="flex-1 overflow-y-auto p-gutter pb-section-gap">
<div class="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-gutter">
<!-- COLUMN 1: Quests & Progress (5 cols wide) -->
<div class="lg:col-span-5 flex flex-col gap-gutter">
<!-- Scholar Pass Card -->
<section class="glass-panel-heavy rounded-[30px] p-6 shine-effect relative overflow-hidden"><div class="animate-pulse space-y-6"><div class="flex justify-between items-start"><div class="space-y-2"><div class="h-8 w-48 bg-surface-variant rounded-lg"></div><div class="h-4 w-32 bg-surface-variant/60 rounded"></div></div><div class="h-16 w-16 bg-surface-variant rounded-[16px]"></div></div><div class="space-y-3"><div class="flex justify-between"><div class="h-4 w-24 bg-surface-variant/60 rounded"></div><div class="h-4 w-16 bg-surface-variant/60 rounded"></div></div><div class="h-3 w-full bg-surface-variant rounded-full"></div></div><div class="pt-6 border-t border-white/40"><div class="h-4 w-32 bg-surface-variant/60 rounded mb-4"></div><div class="flex gap-4"><div class="w-12 h-12 rounded-full bg-surface-variant"></div><div class="w-12 h-12 rounded-full bg-surface-variant"></div></div></div></div></section>
<!-- Daily Quests -->
<section class="glass-panel rounded-[30px] p-6"><div class="animate-pulse"><div class="flex justify-between items-center mb-6"><div class="h-8 w-40 bg-surface-variant rounded-lg"></div><div class="h-4 w-16 bg-surface-variant/60 rounded"></div></div><div class="flex flex-col gap-3"><div class="h-20 w-full bg-surface-variant/40 rounded-[20px]"></div><div class="h-20 w-full bg-surface-variant/40 rounded-[20px]"></div><div class="h-20 w-full bg-surface-variant/40 rounded-[20px]"></div></div></div></section>
</div>
<!-- COLUMN 2: Profile & Activities (7 cols wide) -->
<div class="lg:col-span-7 flex flex-col gap-gutter">
<!-- Profile Header Card with Overlap -->
<section class="glass-panel rounded-[30px] pt-16 px-6 pb-6 relative mt-12"><div class="absolute -top-12 left-6 w-24 h-24 rounded-[24px] bg-surface-variant animate-pulse"></div><div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 ml-[110px] md:ml-0 md:pl-[110px] animate-pulse"><div class="space-y-2"><div class="h-10 w-48 bg-surface-variant rounded-lg"></div><div class="h-6 w-64 bg-surface-variant/60 rounded"></div></div><div class="flex gap-2"><div class="h-8 w-24 bg-surface-variant/60 rounded-full"></div><div class="h-8 w-24 bg-surface-variant/60 rounded-full"></div></div></div></section>
<!-- Stats Row -->
<div class="grid grid-cols-2 gap-gutter"><div class="h-24 bg-surface-variant/40 rounded-[24px] animate-pulse"></div><div class="h-24 bg-surface-variant/40 rounded-[24px] animate-pulse"></div></div>
<!-- Active Project & Timeline Split -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Active Project -->
<section class="glass-panel rounded-[30px] p-6 flex flex-col justify-between"><div class="animate-pulse space-y-6"><div class="flex justify-between"><div class="w-10 h-10 bg-surface-variant rounded-[12px]"></div><div class="w-20 h-6 bg-surface-variant/60 rounded"></div></div><div class="space-y-2"><div class="h-8 w-3/4 bg-surface-variant rounded"></div><div class="h-4 w-full bg-surface-variant/60 rounded"></div><div class="h-4 w-5/6 bg-surface-variant/60 rounded"></div></div><div class="mt-auto pt-4"><div class="h-2 w-full bg-surface-variant rounded-full"></div></div></div></section>
<!-- Recent Activities Timeline -->
<section class="glass-panel rounded-[30px] p-6"><div class="animate-pulse"><div class="h-4 w-32 bg-surface-variant/60 rounded mb-6"></div><div class="space-y-8 ml-3 border-l-2 border-surface-variant/30 pl-6"><div class="relative"><div class="absolute -left-[31px] top-1 w-4 h-4 rounded-full bg-surface-variant"></div><div class="h-3 w-16 bg-surface-variant/40 rounded mb-2"></div><div class="h-4 w-40 bg-surface-variant/60 rounded"></div></div><div class="relative"><div class="absolute -left-[31px] top-1 w-4 h-4 rounded-full bg-surface-variant"></div><div class="h-3 w-16 bg-surface-variant/40 rounded mb-2"></div><div class="h-4 w-48 bg-surface-variant/60 rounded"></div></div></div><div class="mt-8 h-10 w-full bg-surface-variant/40 rounded-[16px]"></div></div></section>
</div>
</div>
</div>
</div>
</main>
<style>
        @keyframes slide {
            0% { background-position: 0 0; }
            100% { background-position: 20px 20px; }
        }
    </style>
</body></html>
